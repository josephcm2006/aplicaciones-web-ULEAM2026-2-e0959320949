<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="container-register">
            <header class="header-container">
                <div id="div-logo">
                    <img src="copy-svgrepo-com.svg" alt="logo">
                </div>
                <div>
                    <h1>Registro de clientes</h1>
                    <p>Completa todos estos campos para poder registrarte con normalidad</p>
                </div>
            </header>
            
            <div>
                <h1>Cédula</h1>
                <input type="text" id="cedula">
                <p>10 dígitos numéricos</p>
                <span id="error-cedula"></span>
            </div>
            
            <div>
                <h1>Nombre</h1>
                <input type="text" id="nombre">
                <p>Máximo 30 carácteres</p>
                <span id="error-nombre"></span>
            </div>
            
            <div>
                <h1>Dirección</h1>
                <input type="text" id="direccion">
                <p>Máximo 50 carácteres</p>
                <span id="error-direccion"></span>
            </div>
            
            <div>
                <h1>Teléfono celular</h1>
                <input type="text" id="telefono">
                <p>10 dígitos numéricos</p>
                <span id="error-telefono"></span>
            </div>
            
            <div>
                <h1>Correo electrónico</h1>
                <input type="text" id="correo">
                <p>Debe incluir @ y dominio</p>
                <span id="error-correo"></span>
            </div>
            
            <div id="alerta-verde">
                ¡Cliente registrado con éxito!
            </div>

            <footer>
                <button id="btn-guardar">Guardar cliente</button>
                <button id="btn-limpiar">Limpiar</button>
            </footer>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
