<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Joseph Alexander Coello Mendoza</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
        }

        .contenedor {
            width: 80%;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .habilidades {
            display: flex;
            justify-content: space-around;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hola, soy Joseph Alexander Coello Mendoza</h1>
        <p>Estudiante de Ingeniería de Software</p>
    </header>

    <div class="contenedor">
        <section>
            <h2>Sobre mí</h2>
            <p>Me apasiona el desarrollo web y la ciencia de datos.</p>
            <a href="#">Contactar</a>
        </section>
        
        <section>
            <h2>Mis Habilidades</h2>
            <ul class="habilidades">
                <li>Python</li>
                <li>JavaScript</li>
                <li>HTML & CSS</li>
                <li>Bases de Datos</li>
            </ul>
        </section>
    </div>
</body>
</html>
