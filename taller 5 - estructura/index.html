<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div class="contenedor">
        <!-- Cabecera de la aplicacion -->
        <header>
            <h1>Registro de Estudiantes</h1>
            <p>Sistema de inscripcion universitaria con validacion y almacenamiento local</p>
        </header>

        <!-- Mensaje de alerta global -->
        <div id="alertaGlobal" class="alerta"></div>

        <!-- Seccion del formulario -->
        <section class="tarjeta">
            <h2>Formulario de Registro</h2>
            <form id="formularioEstudiante" novalidate>
                <div class="formulario-grid">
                    <!-- Campo Cedula -->
                    <div class="grupo-campo">
                        <label for="cedula">Cedula de Identidad:</label>
                        <input type="text" id="cedula" name="cedula" placeholder="Ej. 1723456789" maxlength="10">
                        <span class="mensaje-error" id="errorCedula"></span>
                    </div>

                    <!-- Campo Telefono -->
                    <div class="grupo-campo">
                        <label for="telefono">Telefono de Contacto:</label>
                        <input type="text" id="telefono" name="telefono" placeholder="Ej. 0987654321" maxlength="10">
                        <span class="mensaje-error" id="errorTelefono"></span>
                    </div>

                    <!-- Campo Apellidos -->
                    <div class="grupo-campo">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" placeholder="Ej. Perez Gomez">
                        <span class="mensaje-error" id="errorApellidos"></span>
                    </div>

                    <!-- Campo Nombres -->
                    <div class="grupo-campo">
                        <label for="nombres">Nombres:</label>
                        <input type="text" id="nombres" name="nombres" placeholder="Ej. Juan Carlos">
                        <span class="mensaje-error" id="errorNombres"></span>
                    </div>

                    <!-- Campo Direccion -->
                    <div class="grupo-campo campo-completo">
                        <label for="direccion">Direccion de Domicilio:</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Ej. Av. America N34-21 y Rumipamba">
                        <span class="mensaje-error" id="errorDireccion"></span>
                    </div>

                    <!-- Campo Correo Electronico -->
                    <div class="grupo-campo campo-completo">
                        <label for="correo">Correo Electronico:</label>
                        <input type="email" id="correo" name="correo" placeholder="Ej. usuario@correo.com">
                        <span class="mensaje-error" id="errorCorreo"></span>
                    </div>

                    <!-- Campo Facultad -->
                    <div class="grupo-campo campo-completo">
                        <label for="facultad">Facultad:</label>
                        <input type="text" id="facultad" name="facultad" placeholder="Ej. Ingenieria y Ciencias Aplicadas" list="listaFacultades">
                        <datalist id="listaFacultades">
                            <option value="Ingenieria y Ciencias Aplicadas"></option>
                            <option value="Ciencias Administrativas"></option>
                            <option value="Ciencias Medicas"></option>
                            <option value="Jurisprudencia"></option>
                            <option value="Filosofia y Letras"></option>
                            <option value="Arquitectura y Urbanismo"></option>
                        </datalist>
                        <span class="mensaje-error" id="errorFacultad"></span>
                    </div>

                    <!-- Campo Nivel -->
                    <div class="grupo-campo">
                        <label for="nivel">Nivel (1 al 10):</label>
                        <input type="text" id="nivel" name="nivel" placeholder="Ej. 1" maxlength="2">
                        <span class="mensaje-error" id="errorNivel"></span>
                    </div>

                    <!-- Campo Paralelo -->
                    <div class="grupo-campo">
                        <label for="paralelo">Paralelo:</label>
                        <input type="text" id="paralelo" name="paralelo" placeholder="Ej. A" maxlength="1">
                        <span class="mensaje-error" id="errorParalelo"></span>
                    </div>

                    <!-- Botones del formulario -->
                    <div class="acciones-formulario">
                        <button type="button" id="btnLimpiar" class="btn btn-secundario">Limpiar</button>
                        <button type="submit" id="btnGuardar" class="btn btn-primario">Registrar Estudiante</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Seccion de lista de estudiantes -->
        <section class="tarjeta">
            <div class="cabecera-tabla">
                <h2>Estudiantes Registrados</h2>
                <span class="contador-estudiantes" id="contadorEstudiantes">Total registrados: 0</span>
            </div>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Cedula</th>
                            <th>Apellidos</th>
                            <th>Nombres</th>
                            <th>Direccion</th>
                            <th>Telefono</th>
                            <th>Correo</th>
                            <th>Facultad</th>
                            <th>Nivel</th>
                            <th>Paralelo</th>
                            <th>Accion</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaEstudiantes">
                        <!-- Las filas seran agregadas dinamicamente mediante JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Script de la aplicacion -->
    <script src="js/app.js"></script>
</body>
</html>
